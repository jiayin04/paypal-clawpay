[project]
name = "clawpay-middleware"
version = "0.1.0"
description = "ClawPay middleware: voice-agent to merchant-agent to PayPal payment orchestration backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "supabase==2.33.0",
    "uvicorn==0.54.0",
    "tzdata==2026.5",
    "httpx==0.28.1",
    "cryptography==50.0.2",
    "pyjwt==2.15.1",
    "postgrest==2.33.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
